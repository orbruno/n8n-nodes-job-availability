name: CI

on:
  pull_request:
  push:
    branches:
      - main

# Cancel in-progress runs for the same branch/PR to avoid wasting CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Node ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.22.0', '24.19.0']

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Pin npm
        run: 'npm install --global npm@11.6.2'

      - name: Confirm toolchain
        run: 'node --version && npm --version'

      - name: Install dependencies
        run: 'npm ci'

      - name: Run lint
        run: 'npm run lint'

      - name: Run typecheck
        run: 'npm run typecheck'

      - name: Typecheck tests
        run: 'npm run typecheck:test'

      - name: Run build
        run: 'npm run build'

      - name: Run local scanner rules
        run: 'npm run scanner:local'

      - name: Run tests
        run: 'npm test'

      - name: Inspect package
        run: 'npm run package:inspect'
